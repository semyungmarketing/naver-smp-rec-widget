name: Update REC/SMP data

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00) 실행
    - cron: "0 0 * * *"
  workflow_dispatch: {} # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps + Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install Pillow

      - name: Fetch REC/SMP data via Seoul-region proxy
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
        run: python3 scripts/fetch_data.py

      - name: Render widget images (rec.json / smp.json -> png)
        run: python3 scripts/render_widget.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rec.json smp.json rec_widget.png smp_widget.png
          git diff --staged --quiet || git commit -m "chore: update REC/SMP data ($(date +'%Y-%m-%d'))"
          git push
